worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 8m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    upstream catalog_api { zone api 64k; server api:8000 resolve; }
    upstream catalog_bot { zone bot 64k; server bot:8000 resolve; }
    upstream catalog_web { zone web 64k; server web:3000 resolve; }

    server {
        listen 80;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location = /health/live { return 200 "ok\n"; }
        location = /api/health/ready { proxy_pass http://catalog_api/health/ready; }
        location /api/ { proxy_pass http://catalog_api; }
        location = /telegram/webhook {
            client_max_body_size 256k;
            proxy_pass http://catalog_bot;
        }
        location /internal/ { return 404; }
        location / { proxy_pass http://catalog_web; }
    }
    # Internal port is not published on the host. Bot and CLI use it for API failover.
    server {
        listen 8081;
        location / { proxy_pass http://catalog_api; }
    }
}
